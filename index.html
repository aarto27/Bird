<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#38bdf8">
    <meta name="description" content="Flappy Bird — Responsive 2D HTML5 Canvas browser game for desktop, tablet, and mobile.">
    <title>Flappy Bird</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/bird-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container" class="game-container">
        <canvas id="game-canvas" aria-label="Flappy Bird game canvas"></canvas>

        <!-- In-Game HUD -->
        <div id="hud" class="hud hidden" aria-live="polite">
            <div class="hud-score-wrap">
                <span id="live-score" class="live-score">0</span>
            </div>
            <div class="hud-actions">
                <button id="hud-sound-btn" class="icon-btn" type="button" aria-label="Toggle sound" title="Toggle Sound (M)">
                    <span class="sound-icon" aria-hidden="true">&#128266;</span>
                </button>
                <button id="pause-btn" class="icon-btn" type="button" aria-label="Pause game" title="Pause (P)">
                    <span aria-hidden="true">&#10074;&#10074;</span>
                </button>
            </div>
        </div>

        <!-- Ready Prompt -->
        <div id="ready-banner" class="ready-banner hidden" aria-hidden="true">
            <div class="ready-badge">GET READY!</div>
            <p class="ready-hint">Tap or Press <kbd>Space</kbd> to Flap</p>
        </div>

        <!-- Main Menu Overlay -->
        <section id="menu-screen" class="overlay-screen" aria-label="Main Menu">
            <div class="menu-card">
                <div class="logo-wrap">
                    <span class="logo-eyebrow">ARCADE EDITION</span>
                    <h1 class="game-logo">FLAPPY BIRD</h1>
                </div>

                <div class="best-pill">
                    <span class="best-label">BEST SCORE</span>
                    <strong id="menu-best-score" class="best-value">0</strong>
                </div>

                <div class="menu-buttons">
                    <button id="play-btn" class="cartoon-btn btn-play" type="button">
                        <span class="btn-icon" aria-hidden="true">&#9654;</span>
                        <span>PLAY</span>
                    </button>

                    <button id="menu-sound-btn" class="cartoon-btn btn-secondary" type="button" aria-pressed="true">
                        <span id="menu-sound-icon" aria-hidden="true">&#128266;</span>
                        <span id="menu-sound-label">SOUND: ON</span>
                    </button>
                </div>

                <p class="controls-note">
                    Desktop: <kbd>Space</kbd> / Click &bull; Mobile: Tap anywhere
                </p>
            </div>
        </section>

        <!-- Pause Overlay -->
        <section id="pause-screen" class="overlay-screen hidden" aria-label="Game Paused">
            <div class="modal-card">
                <h2 class="modal-title">PAUSED</h2>

                <div class="modal-buttons">
                    <button id="resume-btn" class="cartoon-btn btn-play" type="button">RESUME</button>
                    <button id="pause-restart-btn" class="cartoon-btn btn-amber" type="button">RESTART</button>
                    <button id="pause-sound-btn" class="cartoon-btn btn-secondary" type="button">SOUND: ON</button>
                    <button id="pause-menu-btn" class="cartoon-btn btn-neutral" type="button">MAIN MENU</button>
                </div>
            </div>
        </section>

        <!-- Game Over Overlay -->
        <section id="gameover-screen" class="overlay-screen hidden" aria-label="Game Over">
            <div class="modal-card gameover-card">
                <h2 class="modal-title gameover-title">GAME OVER</h2>

                <div class="scoreboard-panel">
                    <div class="medal-slot">
                        <span class="panel-label">MEDAL</span>
                        <div id="medal-badge" class="medal-badge medal-none" aria-label="No medal earned">
                            <span id="medal-icon" class="medal-icon">&#9733;</span>
                        </div>
                        <span id="medal-name" class="medal-name">NONE</span>
                    </div>

                    <div class="scores-slot">
                        <div class="score-row">
                            <span class="panel-label">SCORE</span>
                            <strong id="final-score" class="panel-value">0</strong>
                        </div>
                        <div class="score-row">
                            <span class="panel-label">
                                BEST
                                <span id="new-best-tag" class="new-best-tag hidden">NEW!</span>
                            </span>
                            <strong id="final-best" class="panel-value">0</strong>
                        </div>
                    </div>
                </div>

                <div class="modal-buttons">
                    <button id="play-again-btn" class="cartoon-btn btn-play" type="button">PLAY AGAIN</button>
                    <button id="gameover-menu-btn" class="cartoon-btn btn-neutral" type="button">MAIN MENU</button>
                </div>

                <p class="restart-hint">Press <kbd>Enter</kbd> to Play Again</p>
            </div>
        </section>

        <div class="credits-badge">made by : Hitansh &amp; Yuvansh</div>
    </div>

    <script src="game.js"></script>
</body>
</html>
